<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log-in-up</title>
    <link rel="stylesheet" href="style.css">
    <script src="log.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <div class="form-login top">
            <h1>log in</h1>
            <div class="input-group">
                <input type="text" id="inpu1" required>
                <label for="inpu1">username</label>
            </div>
            <div class="input-group">
                <input type="password" id="inpu2" required>
                <label for="inpu2">password</label>
            </div>
            <div class="remember">
                <label for="check"><input type="checkbox" id="check">Remember me</label>
            </div>
            <button type="button">LogIn</button>
            <div class="pra">
                <p>Don't have an acount? <a href="#" class="signUp">Sign up</a></p>
            </div>
        </div>
        <!-- sign up -->
         <div class="form-login form-signup bottom">
            <h1>sign up</h1>
            <div class="input-group">
                <input type="text" id="inpu1" required>
                <label for="inpu1">username</label>
            </div>
            <div class="input-group">
                <input type="email" id="inpu1" required>
                <label for="inpu1">Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="inpu2" required>
                <label for="inpu2">password</label>
            </div>
            <div class="remember">
                <label for="check2"><input type="checkbox" id="check2">i agree to the terms and condition</label>
            </div>
            <button type="button">sign up</button>
            <div class="pra">
                <p>Already have an acount? <a href="#" class="signIn">log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
